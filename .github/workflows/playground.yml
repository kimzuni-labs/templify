---
name: Deploy static content to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "packages/@kimzuni/templify/**"
      - ".github/workflows/playground.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set VITE_NEXT_GIT_REF
        run: |
          REF_NAME=$(git describe --tags --exact-match 2> /dev/null || git rev-parse --short HEAD)
          if [ -z "$REF_NAME" ]; then
            echo "Failed to detect git ref" >&2
            exit 1
          fi
          echo "VITE_NEXT_GIT_REF=$REF_NAME" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./playground/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
