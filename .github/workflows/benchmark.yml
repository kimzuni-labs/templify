---
name: Performance Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "packages/@kimzuni/templify/**"
  push:
    tags:
      - 'v*'
    paths:
      - "packages/@kimzuni/templify/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build
        working-directory: packages/@kimzuni/templify
        run: bun run build

      - name: Run benchmark
        working-directory: packages/@kimzuni/templify
        run: bun run bench > benchmark-result.md

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchmark-result
          path: packages/@kimzuni/templify/benchmark-result.md
